<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="promoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <radialGradient id="promoGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="promoTxt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#promoBg)"/>
  <rect width="640" height="360" fill="url(#promoGlow)"/>

  <!-- Title -->
  <text x="40" y="140" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="url(#promoTxt)" filter="url(#glow4)">
    MINING
  </text>
  <text x="40" y="200" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="url(#promoTxt)" filter="url(#glow4)">
    APP
  </text>
  
  <text x="40" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#b0b0d0">
    ⛏️ Bepul pul qazib oling!
  </text>

  <!-- CTA -->
  <g transform="translate(40, 300)">
    <rect x="0" y="-20" width="220" height="44" rx="22" fill="#00e676"/>
    <text x="110" y="10" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#0f0f1e">
      ▶ BOSHLASH
    </text>
  </g>

  <!-- Pickaxe on right -->
  <g transform="translate(490, 180)" filter="url(#glow4)">
    <circle r="100" fill="#00e676" opacity="0.1"/>
    <path d="M -70 -40 Q -35 -70 0 -60 Q 35 -70 70 -40 Q 45 -28 25 -35 Q 12 -40 0 -40 Q -12 -40 -25 -35 Q -45 -28 -70 -40 Z"
          fill="url(#promoTxt)" stroke="#00e676" stroke-width="2"/>
    <rect x="-14" y="-40" width="28" height="110" rx="10" fill="#8d6e3d" stroke="#3a2a10" stroke-width="2" transform="rotate(30)"/>
  </g>
</svg>