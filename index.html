<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'none';" />
  <title>⛏️ Mining</title>

  <style>
    html { background: #000; margin: 0; padding: 0; }
    body { visibility: hidden; margin: 0; padding: 0; }
    html.tg-ready body { visibility: visible; }
  </style>

  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Guard -->
  <script src="guard.js"></script>
  
  <!-- MONETAG SDK (Adsgram o'rniga) -->
  <script src="//libtl.com/sdk.js" data-zone="10918742" data-sdk="show_10918742"></script>
  
  <!-- Secure Storage & Effects -->
  <script src="secure.js"></script>
  <script src="effects.js"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <canvas id="particles" class="particles-canvas"></canvas>

  <button class="sound-toggle" id="soundToggle" aria-label="Ovoz">🔊</button>

  <div class="pickaxe" id="pickaxe">⛏️</div>

  <div class="app">
    <div class="card">
      <h1 class="title">⛏️ Mining</h1>
      <div class="balance-box">
        <div class="balance-label">Balans</div>
        <div class="balance" id="balance">$0.00000</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status" id="status">Boshlash uchun tugmani bosing</div>
      <button id="startBtn" class="btn">Boshlash</button>
    </div>

    <div class="bonus-card" id="bonusCard">
      <div class="bonus-header">
        <span class="bonus-icon">🎁</span>
        <span class="bonus-title">Kunlik bonus</span>
      </div>
      <div class="bonus-amount">$0.001</div>
      <button id="bonusBtn" class="bonus-btn">🎁 Bonusni olish</button>
      <div class="bonus-countdown" id="bonusCountdown">Tayyor!</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Asosiy</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profil</span>
    </a>
  </nav>

  <script src="index.js"></script>
</body>
</html>
