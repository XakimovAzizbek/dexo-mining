<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square -->
  <rect width="512" height="512" rx="120" fill="url(#btnBg)"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="150" fill="#0f0f1e" opacity="0.3"/>
  
  <!-- Pickaxe -->
  <g transform="translate(256, 256)" filter="url(#glow3)">
    <path d="M -80 -50 Q -40 -85 0 -75 Q 40 -85 80 -50 Q 55 -35 30 -42 Q 15 -50 0 -50 Q -15 -50 -30 -42 Q -55 -35 -80 -50 Z"
          fill="#ffffff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="-16" y="-50" width="32" height="130" rx="10" fill="#ffffff" stroke="#0f0f1e" stroke-width="3" transform="rotate(30)"/>
  </g>
</svg>