<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0f1e"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00b0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="pickGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#centerGlow)"/>

  <!-- Grid dots -->
  <g fill="#00e676" opacity="0.15">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/>
    <circle cx="300" cy="100" r="2"/><circle cx="400" cy="100" r="2"/>
    <circle cx="500" cy="100" r="2"/><circle cx="600" cy="100" r="2"/>
    <circle cx="700" cy="100" r="2"/><circle cx="800" cy="100" r="2"/>
    <circle cx="900" cy="100" r="2"/><circle cx="1000" cy="100" r="2"/>
    <circle cx="1100" cy="100" r="2"/><circle cx="1200" cy="100" r="2"/>
    <circle cx="100" cy="620" r="2"/><circle cx="200" cy="620" r="2"/>
    <circle cx="300" cy="620" r="2"/><circle cx="400" cy="620" r="2"/>
    <circle cx="500" cy="620" r="2"/><circle cx="600" cy="620" r="2"/>
    <circle cx="700" cy="620" r="2"/><circle cx="800" cy="620" r="2"/>
    <circle cx="900" cy="620" r="2"/><circle cx="1000" cy="620" r="2"/>
    <circle cx="1100" cy="620" r="2"/><circle cx="1200" cy="620" r="2"/>
  </g>

  <!-- Left decorative particles -->
  <circle cx="80" cy="200" r="4" fill="#00e676" opacity="0.5"/>
  <circle cx="150" cy="400" r="6" fill="#00b0ff" opacity="0.4"/>
  <circle cx="60" cy="550" r="3" fill="#ffe75c" opacity="0.6"/>

  <!-- Right decorative particles -->
  <circle cx="1200" cy="220" r="5" fill="#00e676" opacity="0.5"/>
  <circle cx="1130" cy="450" r="7" fill="#00b0ff" opacity="0.4"/>
  <circle cx="1210" cy="560" r="4" fill="#ffe75c" opacity="0.6"/>

  <!-- Pickaxe in circle -->
  <g transform="translate(640, 260)">
    <circle r="110" fill="none" stroke="url(#pickGrad2)" stroke-width="4" opacity="0.6" filter="url(#glow2)"/>
    <circle r="90" fill="#00e676" opacity="0.08"/>
    
    <!-- Pickaxe symbol -->
    <g filter="url(#glow2)">
      <path d="M -60 -40 Q -30 -70 0 -60 Q 30 -70 60 -40 Q 40 -30 20 -35 Q 10 -40 0 -40 Q -10 -40 -20 -35 Q -40 -30 -60 -40 Z"
            fill="url(#pickGrad2)" stroke="#00e676" stroke-width="2"/>
      <rect x="-12" y="-40" width="24" height="100" rx="8" fill="#8d6e3d" stroke="#3a2a10" stroke-width="2" transform="rotate(30)"/>
    </g>
  </g>

  <!-- Title -->
  <text x="640" y="460" font-family="Arial Black, sans-serif" font-size="86" font-weight="900" 
        text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow2)">
    MINING APP
  </text>

  <!-- Subtitle -->
  <text x="640" y="510" font-family="Arial, sans-serif" font-size="26" font-weight="600" 
        text-anchor="middle" fill="#b0b0d0" letter-spacing="2">
    ⛏️ PUL QAZIB OLISH ⛏️
  </text>

  <!-- Features row -->
  <g transform="translate(640, 580)">
    <text x="-340" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#00e676">💎 BEPUL</text>
    <text x="-60" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#00b0ff">⚡ TEZ</text>
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#ffe75c">🎁 BONUSLAR</text>
    <text x="400" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#00e676">🚀 BOOST</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(640, 660)">
    <rect x="-200" y="-30" width="400" height="60" rx="30" fill="url(#btnGrad)" filter="url(#glow2)"/>
    <text x="0" y="8" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" 
          text-anchor="middle" fill="#0f0f1e">▶ BOSHLASH</text>
  </g>
</svg>